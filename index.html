<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nitro Racer 2D</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* MENU PRINCIPAL ESTILIZADO */
        #menu { 
            position: absolute; 
            z-index: 100; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            border: 10px solid #16213e;
        }

        h1 { 
            font-size: 4rem; 
            letter-spacing: 5px;
            color: #00d2ff;
            text-shadow: 0 0 20px #00d2ff, 0 0 40px #3a47d5;
            margin-bottom: 10px;
            font-style: italic;
        }

        .stats-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            min-width: 300px;
        }

        .stats-container p { font-size: 1.2rem; margin: 5px 0; color: #abd8f5; }

        .btn-group { display: flex; flex-direction: column; gap: 15px; }

        button { 
            padding: 18px 50px; 
            font-size: 1.1rem; 
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer; 
            border-radius: 4px; 
            border: none; 
            background: linear-gradient(90deg, #3a47d5 0%, #00d2ff 100%);
            color: white; 
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        button:hover { 
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.6);
        }

        .btn-store {
            background: #16213e;
            border: 1px solid #3a47d5;
            font-size: 0.9rem;
        }

        .locked { filter: grayscale(1); opacity: 0.6; cursor: not-allowed; }

        canvas { display: block; background: #111; }
    </style>
</head>
<body>

<div id="menu">
    <h1>NITRO RACER</h1>
    <div class="stats-container">
        <p id="recordeTexto">🏆 BEST: 0s</p>
        <p id="moedasTexto">💰 CASH: $0</p>
    </div>
    
    <div class="btn-group">
        <button onclick="startGame()">START RACE</button>
        <button onclick="comprarCarro(1)" id="btn1" class="btn-store">BLUE BEAST ($50)</button>
        <button onclick="comprarCarro(2)" id="btn2" class="btn-store">GREEN MACHINE ($150)</button>
    </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* ================= ASSETS E FALLBACK ================= */
const imgPista = new Image(); imgPista.src = "https://i.imgur.com/2JYQZQp.png";
const imgMoeda = new Image(); imgMoeda.src = "https://i.imgur.com/v8S778X.png";

const carrosCores = ["#ff4757", "#1e90ff", "#2ed573"]; // Fallback colors
const imagensCarros = [
    "https://i.imgur.com/Y4RZ6Zy.png",
    "https://i.imgur.com/1Q9Z1Zm.png",
    "https://i.imgur.com/6W2Rz9Z.png"
].map(src => {
    const img = new Image();
    img.src = src;
    return img;
});

const inimigosCores = ["#ffa502", "#57606f"];
const imagensInimigos = [
    "https://i.imgur.com/9QOQZ4F.png",
    "https://i.imgur.com/WP7JQkU.png"
].map(src => {
    const img = new Image();
    img.src = src;
    return img;
});

/* ================= DATA ================= */
let moedas = Number(localStorage.getItem("moedas")) || 0;
let recorde = Number(localStorage.getItem("recorde")) || 0;
let carrosComprados = JSON.parse(localStorage.getItem("carros")) || [true, false, false];
let carroAtual = Number(localStorage.getItem("carroAtual")) || 0;

function salvar(){
    localStorage.setItem("moedas", moedas);
    localStorage.setItem("recorde", recorde);
    localStorage.setItem("carros", JSON.stringify(carrosComprados));
    localStorage.setItem("carroAtual", carroAtual);
}

function atualizarMenu(){
    document.getElementById("recordeTexto").innerText = "🏆 BEST: " + recorde + "s";
    document.getElementById("moedasTexto").innerText = "💰 CASH: $" + moedas;
    document.getElementById("btn1").innerText = carrosComprados[1] ? "SELECT BLUE" : "BUY BLUE ($50)";
    document.getElementById("btn2").innerText = carrosComprados[2] ? "SELECT GREEN" : "BUY GREEN ($150)";
    document.getElementById("btn1").classList.toggle("locked", !carrosComprados[1] && moedas < 50);
    document.getElementById("btn2").classList.toggle("locked", !carrosComprados[2] && moedas < 150);
}
atualizarMenu();

function comprarCarro(id){
    const precos = [0, 50, 150];
    if(carrosComprados[id]) { carroAtual = id; }
    else if(moedas >= precos[id]){
        moedas -= precos[id];
        carrosComprados[id] = true;
        carroAtual = id;
    }
    salvar(); atualizarMenu();
}

/* ================= ENGINE ================= */
let player, obstacles = [], gameOver = true, startTime, pistaY = 0;

function GameObject(w, h, x, y, type, color, img) {
    this.w = w; this.h = h; this.x = x; this.y = y;
    this.type = type; this.color = color; this.img = img;
    this.speedX = 0;

    this.draw = function() {
        // Tenta desenhar imagem, se falhar ou não carregar, desenha o retângulo estilizado
        if (this.img && this.img.complete && this.img.naturalWidth !== 0) {
            ctx.drawImage(this.img, this.x, this.y, this.w, this.h);
        } else {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.strokeStyle = "white";
            ctx.strokeRect(this.x, this.y, this.w, this.h);
        }
    };

    this.update = function() {
        this.x += this.speedX;
        if (this.x < 0) this.x = 0;
        if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;
    };
}

function startGame() {
    document.getElementById("menu").style.display = "none";
    gameOver = false; obstacles = []; startTime = Date.now();
    player = new GameObject(55, 95, canvas.width/2-25, canvas.height-120, "player", carrosCores[carroAtual], imagensCarros[carroAtual]);
    loop();
}

function loop() {
    if (gameOver) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let speed = 8 + Math.floor((Date.now() - startTime) / 10000);

    // Pista
    pistaY += speed;
    if (pistaY >= canvas.height) pistaY = 0;
    if (imgPista.complete) {
        ctx.drawImage(imgPista, 0, pistaY, canvas.width, canvas.height);
        ctx.drawImage(imgPista, 0, pistaY - canvas.height, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = "#333"; ctx.fillRect(0,0, canvas.width, canvas.height);
    }

    player.update();
    player.draw();

    // Spawner
    if (Math.random() < 0.03) {
        let x = Math.random() * (canvas.width - 60);
        if (Math.random() > 0.2) {
            let id = Math.floor(Math.random() * 2);
            obstacles.push(new GameObject(55, 95, x, -100, "enemy", inimigosCores[id], imagensInimigos[id]));
        } else {
            obstacles.push(new GameObject(30, 30, x, -50, "coin", "#f1c40f", imgMoeda));
        }
    }

    for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].y += speed;
        obstacles[i].draw();

        // Colisão
        let a = player, b = obstacles[i];
        if (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y) {
            if (b.type === "coin") {
                moedas += 5; obstacles.splice(i, 1); i--;
            } else {
                gameOver = true;
                setTimeout(() => {
                    document.getElementById("menu").style.display = "flex";
                    if (Math.floor((Date.now()-startTime)/1000) > recorde) recorde = Math.floor((Date.now()-startTime)/1000);
                    salvar(); atualizarMenu();
                }, 500);
            }
        }
    }
    obstacles = obstacles.filter(o => o.y < canvas.height);

    // UI
    ctx.fillStyle = "#00d2ff"; ctx.font = "bold 25px Arial";
    ctx.fillText("CASH: $" + moedas, 20, 40);
    ctx.fillText("TIME: " + Math.floor((Date.now()-startTime)/1000) + "s", 20, 75);

    requestAnimationFrame(loop);
}

/* CONTROLES */
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') player.speedX = -10;
    if (e.key === 'ArrowRight' || e.key === 'd') player.speedX = 10;
});
window.addEventListener('keyup', () => player.speedX = 0);
canvas.addEventListener('touchstart', e => {
    let x = e.touches[0].clientX;
    player.speedX = (x < window.innerWidth/2) ? -10 : 10;
});
canvas.addEventListener('touchend', () => player.speedX = 0);
</script>
</body>
</html>
