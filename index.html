<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nitro Racer: Edição Gamer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #050505; 
            color: #fff; 
            font-family: 'Press Start 2P', cursive; /* Fonte Gamer */
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px; /* Limite para parecer celular/arcade */
            background: #111;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.2);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* UI DO MENU */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        h1 { 
            font-size: 25px; 
            color: #00d2ff; 
            text-shadow: 4px 4px #ff0055;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .stats { 
            font-size: 12px; 
            color: #ddd; 
            margin-bottom: 30px; 
            text-align: center;
            line-height: 20px;
        }

        button {
            background: #ff0055;
            color: white;
            border: 4px solid #fff;
            padding: 15px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            margin: 10px;
            width: 80%;
            transition: transform 0.1s;
            box-shadow: 0 5px 0 #990033;
        }

        button:active { transform: translateY(4px); box-shadow: 0 1px 0 #990033; }
        button.secondary { background: #00d2ff; box-shadow: 0 5px 0 #0088aa; }
        button.secondary:active { box-shadow: 0 1px 0 #0088aa; }
        
        .locked { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }

        /* HUD DURANTE O JOGO */
        #hud {
            position: absolute;
            top: 10px; left: 10px;
            color: white;
            font-size: 10px;
            z-index: 5;
            pointer-events: none;
            display: none; /* Escondido no menu */
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="game"></canvas>
    
    <div id="hud">
        <p>💰 <span id="hud-coins">0</span></p>
        <p>⚡ <span id="hud-score">0</span>m</p>
    </div>

    <div id="ui-layer">
        <h1>NITRO<br>RACER</h1>
        <div class="stats">
            <p>🏆 Recorde: <span id="menu-record">0</span>m</p>
            <p>💰 Saldo: $<span id="menu-coins">0</span></p>
        </div>
        
        <button onclick="startGame()">▶ CORRER AGORA</button>
        <button id="btn-car1" class="secondary" onclick="comprarCarro(1)">CARRO FANTASMA ($50)</button>
        <button id="btn-car2" class="secondary" onclick="comprarCarro(2)">TOXIC RACER ($150)</button>
    </div>
</div>

<script>
/* ================= CONFIGURAÇÃO GERAL ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const uiLayer = document.getElementById("ui-layer");
const hud = document.getElementById("hud");

// Ajusta o canvas para alta resolução
function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

/* ================= SISTEMA DE SAVE ================= */
let estado = {
    moedas: Number(localStorage.getItem("moedas")) || 0,
    recorde: Number(localStorage.getItem("recorde")) || 0,
    carros: JSON.parse(localStorage.getItem("carros")) || [true, false, false],
    carroAtual: Number(localStorage.getItem("carroAtual")) || 0
};

function salvar() {
    localStorage.setItem("moedas", estado.moedas);
    localStorage.setItem("recorde", estado.recorde);
    localStorage.setItem("carros", JSON.stringify(estado.carros));
    localStorage.setItem("carroAtual", estado.carroAtual);
    atualizarMenu();
}

/* ================= GRÁFICOS (DESENHO MANUAL) ================= */
// Cores dos carros
const CORES = [
    { body: "#ff0055", glass: "#880022", strip: "#fff" }, // Padrão
    { body: "#00d2ff", glass: "#005588", strip: "#111" }, // Fantasma
    { body: "#00ff00", glass: "#004400", strip: "#000" }  // Toxic
];

function desenharCarro(x, y, scale, tipoCor, isEnemy) {
    const w = 40 * scale;
    const h = 70 * scale;
    const c = isEnemy ? { body: "#555", glass: "#222", strip: "#333" } : CORES[tipoCor];

    ctx.save();
    ctx.translate(x, y);

    // Sombra
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(5, 5, w, h);

    // Rodas
    ctx.fillStyle = "#111";
    ctx.fillRect(-2, 10, 4, 12); ctx.fillRect(w-2, 10, 4, 12); // Frente
    ctx.fillRect(-2, h-22, 4, 12); ctx.fillRect(w-2, h-22, 4, 12); // Trás

    // Chassi
    ctx.fillStyle = c.body;
    ctx.fillRect(0, 0, w, h);

    // Vidro
    ctx.fillStyle = c.glass;
    ctx.fillRect(4, 20, w-8, 15); // Parabrisa
    ctx.fillRect(4, 45, w-8, 10); // Traseiro

    // Detalhe (Listra)
    ctx.fillStyle = c.strip;
    ctx.fillRect(w/2 - 2, 0, 4, h);

    // Luzes
    if(!isEnemy) {
        ctx.fillStyle = "#ffaa00"; // Farol
        ctx.fillRect(2, 2, 6, 4); ctx.fillRect(w-8, 2, 6, 4);
        ctx.fillStyle = "#ff0000"; // Lanterna traseira
        ctx.fillRect(2, h-2, 6, 4); ctx.fillRect(w-8, h-2, 6, 4);
    } else {
        ctx.fillStyle = "#ff0000"; // Inimigo mostra lanterna traseira pra cima se estiver descendo? Não, frente.
        ctx.fillRect(2, h-2, 6, 4); ctx.fillRect(w-8, h-2, 6, 4);
    }

    ctx.restore();
}

function desenharMoeda(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.arc(15, 15, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd700"; // Ouro
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#ffaa00";
    ctx.stroke();
    ctx.fillStyle = "#ffaa00";
    ctx.font = "bold 16px Arial";
    ctx.fillText("$", 10, 21);
    ctx.restore();
}

/* ================= LÓGICA DO JOGO ================= */
let player = { x: 0, y: 0, w: 40, h: 70, speed: 0 };
let obstaculos = [];
let particles = [];
let gameRunning = false;
let pistaOffset = 0;
let speedBase = 5;
let scoreDistancia = 0;

function startGame() {
    uiLayer.style.display = "none";
    hud.style.display = "block";
    
    player.x = canvas.width / 2 - 20;
    player.y = canvas.height - 100;
    player.speed = 0;
    
    obstaculos = [];
    particles = [];
    gameRunning = true;
    speedBase = 6;
    scoreDistancia = 0;
    
    loop();
}

function spawnObstaculo() {
    const laneWidth = canvas.width / 3;
    const lane = Math.floor(Math.random() * 3);
    const x = lane * laneWidth + (laneWidth / 2) - 20;
    
    // 30% chance de ser moeda, 70% inimigo
    const tipo = Math.random() > 0.3 ? 'enemy' : 'coin';
    
    obstaculos.push({
        x: x,
        y: -100,
        w: tipo === 'enemy' ? 40 : 30,
        h: tipo === 'enemy' ? 70 : 30,
        tipo: tipo,
        speed: tipo === 'enemy' ? (Math.random() * 2 + 3) : 0 // Inimigos têm velocidade própria
    });
}

function criarParticula(x, y, color) {
    particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        life: 1.0,
        color: color
    });
}

function update() {
    if (!gameRunning) return;

    // Velocidade aumenta com o tempo (Dificuldade)
    speedBase += 0.005;
    scoreDistancia += speedBase / 10;
    pistaOffset += speedBase;
    if (pistaOffset > 40) pistaOffset = 0;

    // Movimento Jogador
    player.x += player.speed;
    // Limites
    if (player.x < 20) player.x = 20;
    if (player.x + player.w > canvas.width - 20) player.x = canvas.width - player.w - 20;

    // Partículas do escape (fumaça)
    if (Math.random() < 0.3) {
        criarParticula(player.x + 10, player.y + 70, "rgba(100,100,100,");
        criarParticula(player.x + 30, player.y + 70, "rgba(100,100,100,");
    }

    // Spawner
    if (Math.random() < 0.02) spawnObstaculo();

    // Atualizar Obstáculos
    for (let i = obstaculos.length - 1; i >= 0; i--) {
        let obs = obstaculos[i];
        obs.y += speedBase - (obs.tipo === 'enemy' ? obs.speed : 0); // Inimigo anda mais devagar que a pista (efeito ultrapassagem) ou vem contra? Vamos fazer efeito "ultrapassando"

        // Colisão AABB simples
        if (player.x < obs.x + obs.w &&
            player.x + player.w > obs.x &&
            player.y < obs.y + obs.h &&
            player.y + player.h > obs.y) {
            
            if (obs.tipo === 'coin') {
                estado.moedas += 10;
                obstaculos.splice(i, 1);
            } else {
                gameOver();
            }
        }

        if (obs.y > canvas.height) obstaculos.splice(i, 1);
    }

    // Atualizar HUD
    document.getElementById("hud-coins").innerText = estado.moedas;
    document.getElementById("hud-score").innerText = Math.floor(scoreDistancia);
}

function draw() {
    // 1. Fundo (Grama e Estrada)
    ctx.fillStyle = "#2d3436"; // Asfalto
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Faixas laterais (Zebra)
    const gridSize = 40;
    for(let i = -gridSize; i < canvas.height; i+=gridSize) {
        let yPos = i + pistaOffset;
        let cor = (Math.floor((i + pistaOffset) / gridSize) % 2 === 0) ? "#ff0000" : "#ffffff";
        ctx.fillStyle = cor;
        ctx.fillRect(0, yPos, 20, gridSize); // Esq
        ctx.fillRect(canvas.width - 20, yPos, 20, gridSize); // Dir
    }

    // Linhas centrais
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(canvas.width/3, 0, 4, canvas.height);
    ctx.fillRect((canvas.width/3)*2, 0, 4, canvas.height);

    // 2. Obstáculos e Moedas
    obstaculos.forEach(obs => {
        if(obs.tipo === 'enemy') {
            desenharCarro(obs.x, obs.y, 1, 0, true); // 0 = cor padrão, true = inimigo
        } else {
            desenharMoeda(obs.x, obs.y);
        }
    });

    // 3. Jogador
    if (gameRunning) {
        desenharCarro(player.x, player.y, 1, estado.carroAtual, false);
    }

    // 4. Partículas
    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy + 2; // Cai um pouco
        p.life -= 0.05;
        ctx.fillStyle = p.color + p.life + ")";
        ctx.fillRect(p.x, p.y, 4, 4);
        if(p.life <= 0) particles.splice(index, 1);
    });
}

function loop() {
    if (!gameRunning) return;
    update();
    draw();
    requestAnimationFrame(loop);
}

function gameOver() {
    gameRunning = false;
    // Explosão visual
    for(let i=0; i<30; i++) criarParticula(player.x + 20, player.y + 35, "rgba(255,50,0,");
    draw(); // Desenha uma última vez para mostrar a explosão

    if(scoreDistancia > estado.recorde) estado.recorde = Math.floor(scoreDistancia);
    salvar();

    setTimeout(() => {
        alert("💥 BOOM! Você bateu.\nDistância: " + Math.floor(scoreDistancia) + "m");
        uiLayer.style.display = "flex";
        hud.style.display = "none";
        atualizarMenu();
    }, 100);
}

/* ================= CONTROLES ================= */
// Teclado
window.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') player.speed = -7;
    if(e.key === 'ArrowRight' || e.key === 'd') player.speed = 7;
});
window.addEventListener('keyup', () => player.speed = 0);

// Touch (Celular)
canvas.addEventListener('touchstart', e => {
    e.preventDefault(); // Evita scroll
    const touchX = e.touches[0].clientX;
    const meio = window.innerWidth / 2;
    player.speed = (touchX < meio) ? -7 : 7;
});
canvas.addEventListener('touchend', () => player.speed = 0);

/* ================= MENU E LOJA ================= */
function atualizarMenu() {
    document.getElementById("menu-record").innerText = estado.recorde;
    document.getElementById("menu-coins").innerText = estado.moedas;

    // Botão Carro 1
    const btn1 = document.getElementById("btn-car1");
    if (estado.carros[1]) {
        btn1.innerText = (estado.carroAtual === 1) ? "EQUIPADO" : "USAR AZUL";
        btn1.classList.remove("locked");
        btn1.style.background = (estado.carroAtual === 1) ? "#2ecc71" : "#00d2ff";
    } else {
        btn1.innerText = "COMPRAR AZUL ($50)";
        if(estado.moedas < 50) btn1.classList.add("locked");
        else btn1.classList.remove("locked");
    }

    // Botão Carro 2
    const btn2 = document.getElementById("btn-car2");
    if (estado.carros[2]) {
        btn2.innerText = (estado.carroAtual === 2) ? "EQUIPADO" : "USAR VERDE";
        btn2.classList.remove("locked");
        btn2.style.background = (estado.carroAtual === 2) ? "#2ecc71" : "#00d2ff";
    } else {
        btn2.innerText = "COMPRAR VERDE ($150)";
        if(estado.moedas < 150) btn2.classList.add("locked");
        else btn2.classList.remove("locked");
    }
}

function comprarCarro(id) {
    const precos = [0, 50, 150];
    if (estado.carros[id]) {
        estado.carroAtual = id; // Selecionar
    } else if (estado.moedas >= precos[id]) {
        estado.moedas -= precos[id];
        estado.carros[id] = true;
        estado.carroAtual = id;
    }
    salvar();
}

// Iniciar menu
atualizarMenu();
</script>
</body>
</html>
