<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nitro Racer: Turbo Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #050505; 
            color: #fff; 
            font-family: 'Press Start 2P', cursive;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none; /* Impede zoom/scroll no celular */
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            background: #111;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.1);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* UI DO MENU */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(5px);
        }

        h1 { 
            font-size: 30px; 
            color: #00d2ff; 
            text-shadow: 4px 4px #ff0055;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
            transform: skew(-10deg);
        }

        .stats { font-size: 12px; color: #ddd; margin-bottom: 30px; text-align: center; line-height: 20px; }

        button {
            background: #ff0055;
            color: white;
            border: 4px solid #fff;
            padding: 15px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            margin: 10px;
            width: 85%;
            transition: transform 0.1s;
            box-shadow: 0 6px 0 #990033;
            text-transform: uppercase;
        }

        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #990033; }
        button.secondary { background: #00d2ff; box-shadow: 0 6px 0 #0088aa; }
        button.secondary:active { box-shadow: 0 2px 0 #0088aa; }
        .locked { filter: grayscale(1); opacity: 0.6; cursor: not-allowed; }

        /* HUD DURANTE O JOGO */
        #hud {
            position: absolute;
            top: 10px; left: 10px;
            width: calc(100% - 20px);
            z-index: 10;
            pointer-events: none;
            display: none;
        }

        .hud-row { display: flex; justify-content: space-between; font-size: 10px; text-shadow: 2px 2px 0 #000; margin-bottom: 5px; }

        /* BARRA DE NITRO */
        #nitro-container {
            width: 100%;
            height: 15px;
            background: #222;
            border: 2px solid #fff;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        #nitro-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #00ffff);
            transition: width 0.1s linear;
            box-shadow: 0 0 10px #00d2ff;
        }
        #nitro-text {
            text-align: center;
            font-size: 8px;
            margin-top: 2px;
            color: #00ffff;
            text-shadow: 0 0 5px #00d2ff;
        }

        /* BOTÃO NITRO MOBILE */
        #mobile-nitro-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: 70px;
            height: 70px;
            background: rgba(0, 210, 255, 0.5);
            border: 3px solid #00ffff;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: none; /* Só aparece no jogo */
            justify-content: center;
            align-items: center;
            z-index: 15;
            user-select: none;
            touch-action: manipulation;
            box-shadow: 0 0 15px #00d2ff;
        }
        #mobile-nitro-btn:active { background: #00ffff; color: #000; transform: scale(0.95); }
        
        /* Controles de toque invisíveis */
        #touch-controls {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            display: flex;
        }
        .touch-half { width: 50%; height: 100%; }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="game"></canvas>
    
    <div id="hud">
        <div class="hud-row">
            <span>💰 <span id="hud-coins">0</span></span>
            <span>⚡ <span id="hud-score">0</span>m</span>
        </div>
        <div id="nitro-container"><div id="nitro-bar"></div></div>
        <div id="nitro-text">NITRO (ESPAÇO)</div>
    </div>

    <div id="mobile-nitro-btn">⚡</div>
    
    <div id="touch-controls" style="display:none;">
        <div class="touch-half" id="btn-left"></div>
        <div class="touch-half" id="btn-right"></div>
    </div>

    <div id="ui-layer">
        <h1>NITRO<br>RACER</h1>
        <div class="stats">
            <p>🏆 BEST: <span id="menu-record">0</span>m</p>
            <p>💰 CASH: $<span id="menu-coins">0</span></p>
        </div>
        
        <button onclick="startGame()">▶ INICIAR CORRIDA</button>
        <button id="btn-car1" class="secondary" onclick="comprarCarro(1)">CARRO FANTASMA ($50)</button>
        <button id="btn-car2" class="secondary" onclick="comprarCarro(2)">TOXIC RACER ($150)</button>
    </div>
</div>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const uiLayer = document.getElementById("ui-layer");
const hud = document.getElementById("hud");
const nitroBar = document.getElementById("nitro-bar");
const mobileNitroBtn = document.getElementById("mobile-nitro-btn");
const touchControls = document.getElementById("touch-controls");

function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

/* ================= SAVE DATA ================= */
let estado = {
    moedas: Number(localStorage.getItem("moedas")) || 0,
    recorde: Number(localStorage.getItem("recorde")) || 0,
    carros: JSON.parse(localStorage.getItem("carros")) || [true, false, false],
    carroAtual: Number(localStorage.getItem("carroAtual")) || 0
};

function salvar() {
    localStorage.setItem("moedas", estado.moedas);
    localStorage.setItem("recorde", estado.recorde);
    localStorage.setItem("carros", JSON.stringify(estado.carros));
    localStorage.setItem("carroAtual", estado.carroAtual);
    atualizarMenu();
}

/* ================= GRÁFICOS PROCEDURAIS ================= */
const CORES = [
    { body: "#ff0055", glass: "#880022", strip: "#fff" }, 
    { body: "#00d2ff", glass: "#005588", strip: "#111" }, 
    { body: "#00ff00", glass: "#004400", strip: "#000" }  
];

function desenharCarro(x, y, tipoCor, isEnemy, shakeX) {
    const w = 40, h = 70;
    const c = isEnemy ? { body: "#555", glass: "#222", strip: "#333" } : CORES[tipoCor];
    
    ctx.save();
    ctx.translate(x + shakeX, y); // Aplica tremedeira do nitro

    // Sombra
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(5, 5, w, h);

    // Rodas
    ctx.fillStyle = "#111";
    ctx.fillRect(-2, 10, 4, 12); ctx.fillRect(w-2, 10, 4, 12);
    ctx.fillRect(-2, h-22, 4, 12); ctx.fillRect(w-2, h-22, 4, 12);

    // Corpo
    ctx.fillStyle = c.body;
    ctx.fillRect(0, 0, w, h);
    
    // Vidros
    ctx.fillStyle = c.glass;
    ctx.fillRect(4, 20, w-8, 15);
    ctx.fillRect(4, 45, w-8, 10);

    // Detalhe
    ctx.fillStyle = c.strip;
    ctx.fillRect(w/2 - 2, 0, 4, h);

    // Luzes
    if(!isEnemy) {
        ctx.fillStyle = "#ffaa00"; 
        ctx.fillRect(2, 2, 6, 4); ctx.fillRect(w-8, 2, 6, 4);
        ctx.fillStyle = "#ff0000"; 
        ctx.fillRect(2, h-2, 6, 4); ctx.fillRect(w-8, h-2, 6, 4);
    } else {
        ctx.fillStyle = "#ff0000"; 
        ctx.fillRect(2, h-2, 6, 4); ctx.fillRect(w-8, h-2, 6, 4);
    }
    ctx.restore();
}

function desenharMoeda(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.arc(15, 15, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd700";
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#ffaa00"; ctx.stroke();
    ctx.fillStyle = "#ffaa00"; ctx.font = "bold 16px Arial"; ctx.fillText("$", 10, 21);
    ctx.restore();
}

/* ================= LÓGICA DO JOGO ================= */
let player = { x: 0, y: 0, w: 40, h: 70, speed: 0 };
let obstaculos = [], particles = [];
let gameRunning = false;
let pistaOffset = 0, scoreDistancia = 0;
let baseSpeed = 5;

// VARIÁVEIS DO NITRO
let nitro = {
    active: false,
    fuel: 100,
    maxFuel: 100,
    drainRate: 1.5,
    rechargeRate: 0.3
};

function startGame() {
    uiLayer.style.display = "none";
    hud.style.display = "block";
    touchControls.style.display = "flex"; // Ativa toque
    if(window.innerWidth < 800) mobileNitroBtn.style.display = "flex"; // Botão nitro só no mobile
    
    player.x = canvas.width / 2 - 20;
    player.y = canvas.height - 100;
    player.speed = 0;
    
    obstaculos = []; particles = [];
    gameRunning = true;
    baseSpeed = 6;
    scoreDistancia = 0;
    nitro.fuel = 100;
    nitro.active = false;
    
    loop();
}

function update() {
    if (!gameRunning) return;

    // LÓGICA DO NITRO
    let currentSpeed = baseSpeed;
    let shake = 0;

    if (nitro.active && nitro.fuel > 0) {
        currentSpeed = baseSpeed * 2.2; // Velocidade insana
        nitro.fuel -= nitro.drainRate;
        shake = (Math.random() - 0.5) * 4; // Tela treme
        
        // Partículas azuis (Fogo Nitro)
        criarParticula(player.x + 10, player.y + 70, "rgba(0, 255, 255,");
        criarParticula(player.x + 30, player.y + 70, "rgba(0, 255, 255,");
        
    } else {
        nitro.active = false; // Desativa se acabar
        if (nitro.fuel < nitro.maxFuel) nitro.fuel += nitro.rechargeRate;
        
        // Partículas normais (Fumaça)
        if (Math.random() < 0.3) {
            criarParticula(player.x + 10, player.y + 70, "rgba(100,100,100,");
            criarParticula(player.x + 30, player.y + 70, "rgba(100,100,100,");
        }
    }
    
    // Atualiza barra visual
    nitroBar.style.width = (nitro.fuel) + "%";
    nitroBar.style.background = nitro.active ? "#fff" : "linear-gradient(90deg, #00d2ff, #00ffff)";

    // Dificuldade progressiva
    baseSpeed += 0.003;
    scoreDistancia += currentSpeed / 10;
    pistaOffset += currentSpeed;
    if (pistaOffset > 40) pistaOffset = 0;

    // Movimento Player
    player.x += player.speed;
    if (player.x < 20) player.x = 20;
    if (player.x + player.w > canvas.width - 20) player.x = canvas.width - player.w - 20;

    // Spawner
    if (Math.random() < 0.02) spawnObstaculo();

    // Obstáculos
    for (let i = obstaculos.length - 1; i >= 0; i--) {
        let obs = obstaculos[i];
        // Se nitro ativo, inimigos parecem vir mais rápido (efeito visual)
        obs.y += currentSpeed - (obs.tipo === 'enemy' ? obs.speed : 0);

        // Colisão
        if (player.x < obs.x + obs.w && player.x + player.w > obs.x &&
            player.y < obs.y + obs.h && player.y + player.h > obs.y) {
            
            if (obs.tipo === 'coin') {
                estado.moedas += 10;
                obstaculos.splice(i, 1);
            } else {
                gameOver();
            }
        }
        if (obs.y > canvas.height) obstaculos.splice(i, 1);
    }

    // Partículas
    updateParticles();

    // HUD TEXTO
    document.getElementById("hud-coins").innerText = estado.moedas;
    document.getElementById("hud-score").innerText = Math.floor(scoreDistancia);
    
    return shake; // Retorna valor de vibração para o draw
}

function draw(shakeX) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Asfalto
    ctx.fillStyle = "#2d3436"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Efeito de velocidade nas laterais (Blur quando nitro ativo)
    if(nitro.active) {
        ctx.fillStyle = "rgba(0, 210, 255, 0.1)";
        ctx.fillRect(0,0, canvas.width, canvas.height);
    }

    // Zebras (Road limits)
    const gridSize = 40;
    for(let i = -gridSize; i < canvas.height; i+=gridSize) {
        let yPos = i + pistaOffset;
        let cor = (Math.floor((i + pistaOffset) / gridSize) % 2 === 0) ? "#ff0000" : "#ffffff";
        ctx.fillStyle = cor;
        ctx.fillRect(0, yPos, 20, gridSize);
        ctx.fillRect(canvas.width - 20, yPos, 20, gridSize);
    }

    // Objetos
    obstaculos.forEach(obs => {
        if(obs.tipo === 'enemy') desenharCarro(obs.x, obs.y, 1, true, 0);
        else desenharMoeda(obs.x, obs.y);
    });

    // Player (Com shake se nitro ativo)
    if (gameRunning) desenharCarro(player.x, player.y, estado.carroAtual, false, shakeX);

    // Partículas
    particles.forEach(p => {
        ctx.fillStyle = p.color + p.life + ")";
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
}

function spawnObstaculo() {
    const laneWidth = canvas.width / 3;
    const lane = Math.floor(Math.random() * 3);
    const x = lane * laneWidth + (laneWidth / 2) - 20;
    const tipo = Math.random() > 0.3 ? 'enemy' : 'coin';
    
    obstaculos.push({
        x: x, y: -100,
        w: tipo === 'enemy' ? 40 : 30, h: tipo === 'enemy' ? 70 : 30,
        tipo: tipo,
        speed: tipo === 'enemy' ? (Math.random() * 2 + 3) : 0
    });
}

function criarParticula(x, y, color) {
    particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4 + 5, // Vão para baixo rápido
        life: 1.0,
        color: color,
        size: nitro.active ? 6 : 4
    });
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= nitro.active ? 0.08 : 0.05;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

function loop() {
    if (!gameRunning) return;
    let shake = update();
    draw(shake || 0);
    requestAnimationFrame(loop);
}

function gameOver() {
    gameRunning = false;
    mobileNitroBtn.style.display = "none";
    touchControls.style.display = "none";
    
    // Explosão final
    for(let i=0; i<50; i++) criarParticula(player.x + 20, player.y + 35, "rgba(255,50,0,");
    draw(0);

    if(scoreDistancia > estado.recorde) estado.recorde = Math.floor(scoreDistancia);
    salvar();

    setTimeout(() => {
        alert("💥 CRASH!\nDistância: " + Math.floor(scoreDistancia) + "m");
        uiLayer.style.display = "flex";
        hud.style.display = "none";
        atualizarMenu();
    }, 100);
}

/* ================= CONTROLES ================= */
// Teclado
window.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') player.speed = -7;
    if(e.key === 'ArrowRight' || e.key === 'd') player.speed = 7;
    if(e.key === ' ' || e.key === 'Shift') nitro.active = true; // Ativa Nitro
});

window.addEventListener('keyup', e => {
    if(['ArrowLeft','a','ArrowRight','d'].includes(e.key)) player.speed = 0;
    if(e.key === ' ' || e.key === 'Shift') nitro.active = false; // Solta Nitro
});

// Touch (Controle de Direção Invisível)
document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); player.speed = -7; });
document.getElementById('btn-left').addEventListener('touchend', (e) => { e.preventDefault(); player.speed = 0; });

document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); player.speed = 7; });
document.getElementById('btn-right').addEventListener('touchend', (e) => { e.preventDefault(); player.speed = 0; });

// Touch (Botão Nitro)
mobileNitroBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    nitro.active = true;
    mobileNitroBtn.style.transform = "scale(0.9)";
});
mobileNitroBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    nitro.active = false;
    mobileNitroBtn.style.transform = "scale(1)";
});

/* ================= MENU ================= */
function atualizarMenu() {
    document.getElementById("menu-record").innerText = estado.recorde;
    document.getElementById("menu-coins").innerText = estado.moedas;

    [1, 2].forEach(id => {
        const btn = document.getElementById("btn-car" + id);
        const preco = id === 1 ? 50 : 150;
        const nome = id === 1 ? "AZUL" : "VERDE";
        
        if (estado.carros[id]) {
            btn.innerText = (estado.carroAtual === id) ? "EQUIPADO" : "USAR " + nome;
            btn.classList.remove("locked");
            btn.style.background = (estado.carroAtual === id) ? "#2ecc71" : "#00d2ff";
        } else {
            btn.innerText = `COMPRAR ${nome} ($${preco})`;
            if(estado.moedas < preco) btn.classList.add("locked");
            else btn.classList.remove("locked");
        }
    });
}

function comprarCarro(id) {
    const precos = [0, 50, 150];
    if (estado.carros[id]) {
        estado.carroAtual = id;
    } else if (estado.moedas >= precos[id]) {
        estado.moedas -= precos[id];
        estado.carros[id] = true;
        estado.carroAtual = id;
    }
    salvar();
}

atualizarMenu();
</script>
</body>
</html>
