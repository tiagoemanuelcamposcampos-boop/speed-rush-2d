<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Corrida 2D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin: 0; background: #111; color: white; font-family: Arial, sans-serif; text-align: center; }
canvas { display: block; margin: auto; background: black; }
#menu { position: absolute; width: 100%; top: 100px; }
button { padding: 10px 20px; margin: 10px; font-size: 18px; }
.locked { opacity: 0.5; }
</style>
</head>
<body>
<div id="menu">
<h1>🏎️ Corrida 2D</h1>
<p id="recordeTexto"></p>
<p id="moedasTexto"></p>
<button onclick="startGame()">▶ Jogar</button><br>
<button onclick="comprarCarro(1)" id="btn1">Comprar Carro Azul (50)</button><br>
<button onclick="comprarCarro(2)" id="btn2">Comprar Carro Verde (150)</button>
</div>
<canvas id="game" width="400" height="600"></canvas>

<!-- Sons -->
<audio id="motor" loop src="https://assets.mixkit.co/sfx/preview/mixkit-fast-car-engine-loop-1196.mp3"></audio>
<audio id="crash" src="https://assets.mixkit.co/sfx/preview/mixkit-car-crash-1562.mp3"></audio>

<script>
/* ================= CANVAS ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ================= IMAGENS ================= */
// carros do jogador
const carrosJogadorSrc = [
    "https://i.imgur.com/Y4RZ6Zy.png", // vermelho
    "https://i.imgur.com/1Q9Z1Zm.png", // azul
    "https://i.imgur.com/6W2Rz9Z.png" // verde
];
// carros inimigos
const carrosInimigosSrc = [
    "https://i.imgur.com/9QOQZ4F.png",
    "https://i.imgur.com/WP7JQkU.png"
];
// fundo da pista
const pistaImg = new Image();
pistaImg.src = "https://i.imgur.com/2JYQZQp.png";
// preload
const carrosJogador = carrosJogadorSrc.map(src => { const img = new Image(); img.src = src; return img; });
const carrosInimigos = carrosInimigosSrc.map(src => { const img = new Image(); img.src = src; return img; });

/* ================= SAVE ================= */
let moedas = Number(localStorage.getItem("moedas")) || 0;
let recorde = Number(localStorage.getItem("recorde")) || 0;
let carrosComprados = JSON.parse(localStorage.getItem("carros")) || [true,false,false];
let carroAtual = Number(localStorage.getItem("carroAtual")) || 0;

function salvar(){
    localStorage.setItem("moedas", moedas);
    localStorage.setItem("recorde", recorde);
    localStorage.setItem("carros", JSON.stringify(carrosComprados));
    localStorage.setItem("carroAtual", carroAtual);
}

/* ================= MENU ================= */
const recordeTexto = document.getElementById("recordeTexto");
const moedasTexto = document.getElementById("moedasTexto");
const btn1 = document.getElementById("btn1");
const btn2 = document.getElementById("btn2");

function atualizarMenu(){
    recordeTexto.innerText = "🏆 Recorde: " + recorde + "s";
    moedasTexto.innerText = "💰 Moedas: " + moedas;
    btn1.className = carrosComprados[1] ? "" : "locked";
    btn2.className = carrosComprados[2] ? "" : "locked";
}
atualizarMenu();

function comprarCarro(id){
    const precos = [0,50,150];
    if(carrosComprados[id]){
        carroAtual = id;
        salvar();
        atualizarMenu(); // Ensure menu updates when selecting
        return;
    }
    if(moedas >= precos[id]){
        moedas -= precos[id];
        carrosComprados[id] = true;
        carroAtual = id;
        salvar();
        atualizarMenu();
    }
}

/* ================= JOGO ================= */
let player, obstacles = [], gameOver = false;
let startTime, ultimoTempoMoeda = 0;
let pistaY = 0;
const motorSound = document.getElementById("motor");
const crashSound = document.getElementById("crash");

function startGame(){
    document.getElementById("menu").style.display = "none";
    canvas.style.display = "block";
    player = new Component(50, 90, carrosJogador[carroAtual], canvas.width / 2 - 25, canvas.height - 100, "image");
    obstacles = [];
    gameOver = false;
    startTime = Date.now();
    ultimoTempoMoeda = startTime;
    // Tocar som do motor
    if (motorSound) {
        motorSound.currentTime = 0;
        motorSound.play();
    }
    requestAnimationFrame(updateGameArea);
}

function Component(width, height, color, x, y, type) {
    this.type = type;
    if (type == "image") {
        this.image = color; // color is the image object here
    }
    this.width = width;
    this.height = height;
    this.x = x;
    this.y = y;
    this.speedX = 0;
    this.speedY = 0;    
    this.update = function() {
        ctx.save();
        if (type == "image") {
            ctx.drawImage(this.image, this.x, this.y, this.width, this.height);
        } else {
            ctx.fillStyle = color;
            ctx.fillRect(this.x, this.y, this.width, this.height);
        }
        ctx.restore();
    }
    this.newPos = function() {
        this.x += this.speedX;
        // Keep player within bounds
        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
    }
    this.crashWith = function(otherobj) {
        const myleft = this.x;
        const myright = this.x + this.width;
        const mytop = this.y;
        const mybottom = this.y + this.height;
        const otherleft = otherobj.x;
        const otherright = otherobj.x + otherobj.width;
        const othertop = otherobj.y;
        const otherbottom = otherobj.y + otherobj.height;
        let crash = true;
        if ((mybottom < othertop) || (mytop > otherbottom) || (myright < otherleft) || (myleft > otherright)) {
            crash = false;
        }
        return crash;
    }
}

function updateGameArea() {
    if (gameOver) return;

    // Clear canvas and draw background
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pistaY += 5 + getCurrentSpeed(); // Scroll speed based on time
    if (pistaY >= canvas.height) {
        pistaY = 0;
    }
    ctx.drawImage(pistaImg, 0, pistaY, canvas.width, canvas.height);
    ctx.drawImage(pistaImg, 0, pistaY - canvas.height, canvas.width, canvas.height);

    // Update player position
    player.newPos();
    player.update();

    // Game logic for obstacles and coins
    generateObstacles();
    moveObstacles();

    // Check for collisions
    for (let i = 0; i < obstacles.length; i++) {
        if (player.crashWith(obstacles[i])) {
            endGame();
            return;
        }
    }

    // Display score and coins
    displayStats();

    requestAnimationFrame(updateGameArea);
}

function getCurrentSpeed() {
    const elapsedSeconds = (Date.now() - startTime) / 1000;
    return Math.min(10, Math.floor(elapsedSeconds / 10)); // Speed increases every 10 seconds
}

function generateObstacles() {
    const minInterval = 80;
    const maxInterval = 150;
    if (!obstacles.length || obstacles[obstacles.length - 1].y > minInterval + Math.random() * maxInterval) {
        const lane = Math.floor(Math.random() * 3); // 3 lanes
        const xPos = lane * (canvas.width / 3) + 25; // center in lane
        const type = Math.random() > 0.8 ? "coin" : "enemy";
        if (type === "enemy") {
            const enemyImg = carrosInimigos[Math.floor(Math.random() * carrosInimigos.length)];
            obstacles.push(new Component(50, 90, enemyImg, xPos, -90, "image"));
        } else {
            // Simple yellow square for a coin
            obstacles.push(new Component(30, 30, "yellow", xPos + 10, -30, "coin"));
        }
    }
}

function moveObstacles() {
    for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].y += 5 + getCurrentSpeed();
        // Check for coin collection
        if (obstacles[i].type === "coin" && player.crashWith(obstacles[i])) {
            moedas += 1;
            salvar();
            obstacles.splice(i, 1);
            i--;
        }
    }
    // Remove off-screen obstacles
    obstacles = obstacles.filter(obs => obs.y < canvas.height);
    // Update visuals
    for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].update();
    }
}

function displayStats() {
    const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.textAlign = "left";
    ctx.fillText("Tempo: " + elapsedSeconds + "s", 10, 30);
    ctx.fillText("💰: " + moedas, 10, 60);
}

function endGame() {
    gameOver = true;
    // Stop sounds
    if (motorSound) motorSound.pause();
    if (crashSound) crashSound.play();

    // Update record
    const finalTime = Math.floor((Date.now() - startTime) / 1000);
    if (finalTime > recorde) {
        recorde = finalTime;
    }
    salvar();

    // Show menu again
    setTimeout(() => {
        document.getElementById("menu").style.display = "block";
        canvas.style.display = "none";
        atualizarMenu();
        alert("Fim de Jogo! Tempo: " + finalTime + "s");
    }, 500); // Small delay for crash sound to play
}

// Handle input (simple left/right movement)
document.addEventListener('keydown', (e) => {
    if (!gameOver && document.getElementById("menu").style.display === "none") {
        if (e.key === 'ArrowLeft' || e.key === 'a') {
            player.speedX = -5;
        } else if (e.key === 'ArrowRight' || e.key === 'd') {
            player.speedX = 5;
        }
    }
});

document.addEventListener('keyup', (e) => {
    if (!gameOver && document.getElementById("menu").style.display === "none") {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ArrowRight' || e.key === 'd') {
            player.speedX = 0;
        }
    }
});

// Basic mobile touch handling (tap left/right side of screen)
canvas.addEventListener('touchstart', (e) => {
    if (!gameOver && document.getElementById("menu").style.display === "none") {
        const touchX = e.touches[0].clientX;
        const canvasRect = canvas.getBoundingClientRect();
        if (touchX < canvasRect.left + canvasRect.width / 2) {
            player.speedX = -5;
        } else {
            player.speedX = 5;
        }
    }
});

canvas.addEventListener('touchend', (e) => {
    player.speedX = 0;
});

// Initially hide canvas
canvas.style.display = "none";
</script>

</body>
</html>
