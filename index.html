<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = Math.min(400, window.innerWidth);
canvas.height = window.innerHeight;

/* ================= IMAGENS ================= */

// carros do jogador
const carrosJogador = [
  "https://i.imgur.com/Y4RZ6Zy.png",
  "https://i.imgur.com/1Q9Z1Zm.png",
  "https://i.imgur.com/6W2Rz9Z.png"
];

// carros inimigos
const carrosInimigos = [
  "https://i.imgur.com/9QOQZ4F.png",
  "https://i.imgur.com/WP7JQkU.png"
];

// pista
const pistaImg = new Image();
pistaImg.src = "https://i.imgur.com/2JYQZQp.png";

let carroPlayerImg = new Image();
let inimigoImgs = carrosInimigos.map(src => {
  let img = new Image();
  img.src = src;
  return img;
});

/* ================= DADOS SALVOS ================= */

let moedas = Number(localStorage.getItem("moedas")) || 0;
let recorde = Number(localStorage.getItem("recorde")) || 0;
let carrosComprados = JSON.parse(localStorage.getItem("carros")) || [true,false,false];
let carroAtual = Number(localStorage.getItem("carroAtual")) || 0;

/* ================= MENU ================= */

document.getElementById("recordeTexto").innerText = "🏆 Recorde: " + recorde + " s";
document.getElementById("moedasTexto").innerText = "💰 Moedas: " + moedas;

function atualizarLoja(){
  document.getElementById("btn1").className = carrosComprados[1] ? "" : "locked";
  document.getElementById("btn2").className = carrosComprados[2] ? "" : "locked";
}
atualizarLoja();

function comprarCarro(id){
  const precos = [0,50,150];
  if(carrosComprados[id]){
    selecionarCarro(id);
    return;
  }
  if(moedas >= precos[id]){
    moedas -= precos[id];
    carrosComprados[id] = true;
    selecionarCarro(id);
    salvar();
  }
}

function selecionarCarro(id){
  carroAtual = id;
  salvar();
}

function salvar(){
  localStorage.setItem("moedas", moedas);
  localStorage.setItem("recorde", recorde);
  localStorage.setItem("carros", JSON.stringify(carrosComprados));
  localStorage.setItem("carroAtual", carroAtual);
}

/* ================= JOGO ================= */

let player, obstacles, gameOver, startTime;
let dificuldade = 1;
let pistaY = 0;

function startGame(){
  document.getElementById("menu").style.display = "none";

  carroPlayerImg.src = carrosJogador[carroAtual];

  player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 120,
    w: 40,
    h: 80,
    speed: 7
  };

  obstacles = [];
  gameOver = false;
  startTime = Date.now();

  document.getElementById("motor").play();
  update();
}

/* ================= CONTROLES ================= */

document.addEventListener("keydown", e => {
  if(e.key === "ArrowLeft") player.x -= player.speed;
  if(e.key === "ArrowRight") player.x += player.speed;
});

canvas.addEventListener("touchstart", e => {
  let x = e.touches[0].clientX;
  x < window.innerWidth/2 ? player.x -= player.speed*3 : player.x += player.speed*3;
});

/* ================= OBSTÁCULOS ================= */

setInterval(() => {
  if(!gameOver){
    obstacles.push({
      x: Math.random() * (canvas.width - 40),
      y: -100,
      w: 40,
      h: 80,
      img: inimigoImgs[Math.floor(Math.random()*inimigoImgs.length)]
    });
  }
}, 1100);

/* ================= LOOP ================= */

function update(){
  if(gameOver) return;

  let tempo = Math.floor((Date.now() - startTime) / 1000);

  // moedas automáticas
  if(tempo > 0 && tempo % 30 === 0){
    moedas += 10;
    salvar();
  }

  dificuldade = 1 + tempo / 30;

  /* pista animada */
  pistaY += 4 * dificuldade;
  if(pistaY >= canvas.height) pistaY = 0;

  ctx.drawImage(pistaImg, 0, pistaY - canvas.height, canvas.width, canvas.height);
  ctx.drawImage(pistaImg, 0, pistaY, canvas.width, canvas.height);

  /* jogador */
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
  ctx.drawImage(carroPlayerImg, player.x, player.y, player.w, player.h);

  /* inimigos */
  obstacles.forEach(o => {
    o.y += 4 * dificuldade;
    ctx.drawImage(o.img, o.x, o.y, o.w, o.h);

    if(
      player.x < o.x + o.w &&
      player.x + player.w > o.x &&
      player.y < o.y + o.h &&
      player.y + player.h > o.y
    ){
      gameOver = true;
      document.getElementById("motor").pause();
      document.getElementById("crash").play();
      if(tempo > recorde){
        recorde = tempo;
        salvar();
      }
      setTimeout(() => location.reload(), 2500);
    }
  });

  obstacles = obstacles.filter(o => o.y < canvas.height);

  /* HUD */
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("⏱️ " + tempo + "s", 10, 30);
  ctx.fillText("💰 " + moedas, 10, 60);

  requestAnimationFrame(update);
}
</script>
