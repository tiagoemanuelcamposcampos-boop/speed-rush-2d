<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Corrida 2D - Estilizado</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body { margin: 0; background: #111; color: white; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; overflow: hidden; }
    canvas { display: block; margin: auto; background: #333; border: 4px solid #444; }
    #menu { position: absolute; width: 100%; top: 50%; transform: translateY(-50%); z-index: 10; background: rgba(0,0,0,0.85); padding: 20px 0; }
    button { padding: 12px 25px; margin: 10px; font-size: 18px; cursor: pointer; border-radius: 5px; border: none; background: #e74c3c; color: white; transition: 0.3s; }
    button:hover { background: #c0392b; }
    .locked { opacity: 0.4; filter: grayscale(1); }
    h1 { font-size: 40px; margin-bottom: 10px; color: #f1c40f; }
</style>
</head>
<body>

<div id="menu">
    <h1>🏎️ CORRIDA 2D</h1>
    <p id="recordeTexto">🏆 Recorde: 0s</p>
    <p id="moedasTexto">💰 Moedas: 0</p>
    <button onclick="startGame()">▶ JOGAR</button><br>
    <button onclick="comprarCarro(1)" id="btn1">Carro Azul (50 💰)</button>
    <button onclick="comprarCarro(2)" id="btn2">Carro Verde (150 💰)</button>
</div>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ================= NOVAS IMAGENS (LINKS ESTÁVEIS) ================= */
const imgPista = new Image();
imgPista.src = "https://img.freepik.com/vetores-gratis/estrada-de-asfalto-sem-emenda-textura-superior-da-estrada-rodovia-urbana-ou-autoestrada_107791-1604.jpg";

const imgMoeda = new Image();
imgMoeda.src = "https://i.imgur.com/v8S778X.png"; 

// Carros do Jogador (Vermelho, Azul, Verde)
const srcJogadores = [
    "http://googleusercontent.com/image_collection/image_retrieval/16989218851675940121_0",
    "http://googleusercontent.com/image_collection/image_retrieval/16448738746049814584_0",
    "http://googleusercontent.com/image_collection/image_retrieval/7207269396184344259_0"
];

// Carros Inimigos
const srcInimigos = [
    "https://i.imgur.com/9QOQZ4F.png",
    "https://i.imgur.com/WP7JQkU.png"
];

const carrosJogador = srcJogadores.map(src => { const img = new Image(); img.src = src; return img; });
const carrosInimigos = srcInimigos.map(src => { const img = new Image(); img.src = src; return img; });

/* ================= SISTEMA DE SAVE ================= */
let moedas = Number(localStorage.getItem("moedas")) || 0;
let recorde = Number(localStorage.getItem("recorde")) || 0;
let carrosComprados = JSON.parse(localStorage.getItem("carros")) || [true, false, false];
let carroAtual = Number(localStorage.getItem("carroAtual")) || 0;

let player, obstacles = [], gameOver = true;
let startTime, pistaY = 0;

function salvar(){
    localStorage.setItem("moedas", moedas);
    localStorage.setItem("recorde", recorde);
    localStorage.setItem("carros", JSON.stringify(carrosComprados));
    localStorage.setItem("carroAtual", carroAtual);
}

function atualizarMenu(){
    document.getElementById("recordeTexto").innerText = "🏆 Recorde: " + recorde + "s";
    document.getElementById("moedasTexto").innerText = "💰 Moedas: " + moedas;
    document.getElementById("btn1").className = carrosComprados[1] ? "" : "locked";
    document.getElementById("btn2").className = carrosComprados[2] ? "" : "locked";
}
atualizarMenu();

function comprarCarro(id){
    const precos = [0, 50, 150];
    if(carrosComprados[id]){
        carroAtual = id;
    } else if(moedas >= precos[id]){
        moedas -= precos[id];
        carrosComprados[id] = true;
        carroAtual = id;
    }
    salvar();
    atualizarMenu();
}

/* ================= COMPONENTE DO JOGO ================= */
function Component(width, height, img, x, y, type) {
    this.type = type;
    this.img = img;
    this.width = width;
    this.height = height;
    this.x = x;
    this.y = y;
    this.speedX = 0;
    
    this.update = function() {
        ctx.drawImage(this.img, this.x, this.y, this.width, this.height);
    }
    
    this.newPos = function() {
        this.x += this.speedX;
        if (this.x < 10) this.x = 10;
        if (this.x + this.width > canvas.width - 10) this.x = canvas.width - this.width - 10;
    }

    this.crashWith = function(otherobj) {
        let p = 10; // Margem para colisão justa
        return !(this.y + this.height - p < otherobj.y || 
                 this.y + p > otherobj.y + otherobj.height || 
                 this.x + this.width - p < otherobj.x || 
                 this.x + p > otherobj.x + otherobj.width);
    }
}

function startGame(){
    document.getElementById("menu").style.display = "none";
    gameOver = false;
    obstacles = [];
    pistaY = 0;
    startTime = Date.now();
    player = new Component(50, 90, carrosJogador[carroAtual], canvas.width/2 - 25, canvas.height - 110, "player");
    updateGameArea();
}

function updateGameArea() {
    if (gameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Movimentação da pista
    let vel = 6 + Math.floor((Date.now() - startTime) / 10000);
    pistaY += vel;
    if (pistaY >= canvas.height) pistaY = 0;
    ctx.drawImage(imgPista, 0, pistaY, canvas.width, canvas.height);
    ctx.drawImage(imgPista, 0, pistaY - canvas.height, canvas.width, canvas.height);

    player.newPos();
    player.update();

    // Spawner de obstáculos e moedas
    if (Math.random() < 0.02) {
        let lane = Math.floor(Math.random() * 3);
        let xPos = 50 + lane * 110;
        if (Math.random() > 0.2) {
            let imgEnemy = carrosInimigos[Math.floor(Math.random() * carrosInimigos.length)];
            obstacles.push(new Component(50, 90, imgEnemy, xPos, -100, "enemy"));
        } else {
            obstacles.push(new Component(30, 30, imgMoeda, xPos + 10, -50, "coin"));
        }
    }

    for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].y += vel;
        obstacles[i].update();

        if (player.crashWith(obstacles[i])) {
            if (obstacles[i].type === "coin") {
                moedas++;
                obstacles.splice(i, 1);
                i--;
            } else {
                gameOver = true;
                finalizarJogo();
            }
        }
    }

    obstacles = obstacles.filter(obs => obs.y < canvas.height);
    
    // HUD de texto
    ctx.fillStyle = "white";
    ctx.font = "bold 20px Arial";
    ctx.fillText("💰 " + moedas, 20, 40);
    ctx.fillText("⏱️ " + Math.floor((Date.now() - startTime)/1000) + "s", 20, 70);

    requestAnimationFrame(updateGameArea);
}

function finalizarJogo() {
    let finalTime = Math.floor((Date.now() - startTime) / 1000);
    if (finalTime > recorde) recorde = finalTime;
    salvar();
    alert("💥 FIM DE JOGO! Tempo: " + finalTime + "s");
    document.getElementById("menu").style.display = "block";
    atualizarMenu();
}

/* ================= CONTROLES ================= */
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') player.speedX = -7;
    if (e.key === 'ArrowRight' || e.key === 'd') player.speedX = 7;
});
window.addEventListener('keyup', () => player.speedX = 0);
</script>

</body>
</html>
